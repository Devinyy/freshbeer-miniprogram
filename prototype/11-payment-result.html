<!DOCTYPE html>
<!-- 鲜啤到 · 支付结果页 | 设计系统：Starbucks 定制 | 主色 #F5A623 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>鲜啤到 · 支付成功</title>
<style>
  :root {
    --color-primary: #F5A623;
    --color-primary-light: #FFF0D6;
    --color-secondary-dark: #2C1810;
    --color-bg: #FFF8F0;
    --color-surface: #FFFFFF;
    --color-surface-alt: #FAF3EB;
    --color-border: #E8DDD0;
    --color-border-light: #F0E8DC;
    --color-text-primary: #2C1810;
    --color-text-secondary: #8B7D6B;
    --color-text-tertiary: #B0A490;
    --color-text-inverse: #FFFFFF;
    --color-success: #4CAF50;
    --color-success-light: #E8F5E9;
    --color-cold-chain: #00BFA5;
    --color-cold-chain-bg: #E0F7F4;
    --gradient-primary-btn: linear-gradient(135deg, #F5A623 0%, #E8951A 100%);
    --shadow-card: 0 1px 4px rgba(44, 24, 16, 0.06);
    --shadow-primary-glow: 0 2px 8px rgba(245, 166, 35, 0.3);
    --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    --font-number: "DIN Alternate", "DIN", "Roboto Mono", "SF Mono", monospace;
    --radius-tag: 4px;
    --radius-card: 12px;
    --radius-pill: 24px;
    --space-xs: 8px;
    --space-sm: 12px;
    --space-md: 16px;
    --space-lg: 20px;
    --space-xl: 24px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: var(--font-body);
    width: 375px;
    height: 812px;
    margin: 0 auto;
    background: var(--color-bg);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* 成功头部 */
  .success-header {
    background: var(--color-surface);
    padding: var(--space-xl) var(--space-md) var(--space-lg);
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .success-header::before {
    content: '';
    position: absolute;
    top: -60px; left: -40px; right: -40px;
    height: 120px;
    background: radial-gradient(ellipse at center, var(--color-primary-light) 0%, transparent 70%);
  }
  .success-icon {
    width: 72px; height: 72px;
    margin: 0 auto var(--space-md);
    position: relative;
    z-index: 1;
    animation: scaleIn 0.5s ease-out;
  }
  @keyframes scaleIn {
    from { transform: scale(0); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .success-title {
    font-size: 20px; font-weight: 700;
    color: var(--color-text-primary);
    margin-bottom: 6px;
    position: relative; z-index: 1;
    animation: fadeIn 0.4s ease-out 0.2s both;
  }
  .success-subtitle {
    font-size: 14px; color: var(--color-text-secondary);
    position: relative; z-index: 1;
    animation: fadeIn 0.4s ease-out 0.3s both;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 订单信息卡 */
  .order-info {
    background: var(--color-surface);
    border-radius: var(--radius-card);
    margin: var(--space-md);
    padding: var(--space-md);
    box-shadow: var(--shadow-card);
  }
  .order-info__row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--color-border-light);
  }
  .order-info__row:last-child { border-bottom: none; }
  .order-info__label { font-size: 13px; color: var(--color-text-secondary); }
  .order-info__value { font-size: 13px; color: var(--color-text-primary); font-weight: 600; }
  .order-info__value--number { font-family: var(--font-number); }
  .order-info__value--success { color: var(--color-success); }

  /* 配送进度 */
  .delivery-progress {
    background: var(--color-surface);
    border-radius: var(--radius-card);
    margin: 0 var(--space-md) var(--space-md);
    padding: var(--space-md);
    box-shadow: var(--shadow-card);
  }
  .delivery-progress__title {
    font-size: 14px; font-weight: 700;
    color: var(--color-text-primary);
    margin-bottom: var(--space-md);
    display: flex; align-items: center; gap: 6px;
  }
  .delivery-progress__status {
    background: var(--color-cold-chain-bg);
    color: var(--color-cold-chain);
    font-size: 10px; font-weight: 600;
    padding: 2px 8px; border-radius: var(--radius-tag);
    margin-left: auto;
  }

  .progress-steps {
    display: flex; justify-content: space-between;
    position: relative;
    margin-bottom: var(--space-md);
  }
  .progress-steps::before {
    content: '';
    position: absolute;
    top: 14px; left: 20px; right: 20px;
    height: 2px;
    background: var(--color-border);
  }
  .progress-step {
    display: flex; flex-direction: column; align-items: center;
    gap: 6px;
    position: relative; z-index: 1;
    flex: 1;
  }
  .progress-step__dot {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--color-surface);
    border: 2px solid var(--color-border);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    color: var(--color-text-tertiary);
  }
  .progress-step--done .progress-step__dot {
    background: var(--color-success);
    border-color: var(--color-success);
    color: #FFF;
  }
  .progress-step--current .progress-step__dot {
    background: var(--color-primary);
    border-color: var(--color-primary);
    color: #FFF;
    box-shadow: 0 0 0 4px var(--color-primary-light);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 4px var(--color-primary-light); }
    50% { box-shadow: 0 0 0 8px rgba(245, 166, 35, 0.1); }
  }
  .progress-step__label {
    font-size: 11px; color: var(--color-text-secondary);
    text-align: center;
  }
  .progress-step--done .progress-step__label,
  .progress-step--current .progress-step__label {
    color: var(--color-text-primary); font-weight: 600;
  }

  .delivery-eta {
    background: var(--color-cold-chain-bg);
    border-radius: 8px;
    padding: var(--space-sm) var(--space-md);
    display: flex; align-items: center; gap: var(--space-sm);
  }
  .delivery-eta__icon {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--color-surface);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .delivery-eta__info { flex: 1; }
  .delivery-eta__title { font-size: 13px; font-weight: 600; color: var(--color-cold-chain); }
  .delivery-eta__time { font-size: 11px; color: var(--color-text-secondary); }
  .delivery-eta__arrow { color: var(--color-cold-chain); font-size: 16px; }

  /* 按钮组 */
  .action-buttons {
    padding: 0 var(--space-md) var(--space-md);
    display: flex; gap: var(--space-sm);
  }
  .btn-secondary {
    flex: 1;
    height: 48px;
    background: var(--color-surface);
    border: 1.5px solid var(--color-primary);
    color: var(--color-primary);
    font-size: 15px;
    font-weight: 600;
    border-radius: var(--radius-pill);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn-primary {
    flex: 1;
    height: 48px;
    background: var(--gradient-primary-btn);
    color: #FFF;
    border: none;
    font-size: 15px;
    font-weight: 600;
    border-radius: var(--radius-pill);
    cursor: pointer;
    box-shadow: var(--shadow-primary-glow);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn-primary:active { opacity: 0.85; }

  /* 推荐区 */
  .recommend-section {
    background: var(--color-surface);
    border-radius: var(--radius-card);
    margin: 0 var(--space-md) var(--space-md);
    padding: var(--space-md);
    box-shadow: var(--shadow-card);
  }
  .recommend-title {
    font-size: 14px; font-weight: 700;
    color: var(--color-text-primary);
    margin-bottom: var(--space-sm);
    display: flex; align-items: center; gap: 6px;
  }
  .recommend-card {
    display: flex; gap: var(--space-sm);
    padding: var(--space-sm);
    background: var(--color-surface-alt);
    border-radius: 8px;
  }
  .recommend-card__icon {
    width: 48px; height: 48px;
    border-radius: 8px;
    background: var(--gradient-primary-btn);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .recommend-card__info { flex: 1; }
  .recommend-card__title { font-size: 13px; font-weight: 600; color: var(--color-text-primary); }
  .recommend-card__desc { font-size: 11px; color: var(--color-text-secondary); margin-top: 2px; }
  .recommend-card__btn {
    font-size: 12px; font-weight: 600;
    color: var(--color-primary);
    align-self: center;
  }

  /* 合规警示 */
  .compliance-warning {
    text-align: center; font-size: 11px; color: var(--color-text-tertiary);
    padding: var(--space-md); line-height: 1.6;
  }

/* === 无障碍：动画降级 === */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

</style>
</head>
<body>
  <!-- 成功头部 -->
  <div class="success-header">
    <svg class="success-icon" viewBox="0 0 72 72" fill="none">
      <circle cx="36" cy="36" r="34" fill="#E8F5E9"/>

      <div class="progress-step">

        </div>

      </div>

    <div class="delivery-eta">
      <div class="delivery-eta__icon">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 2C6.24 2 4 4.24 4 7C4 11 9 16 9 16C9 16 14 11 14 7C14 4.24 11.76 2 9 2Z" fill="#00BFA5"/><circle cx="9" cy="7" r="2" fill="#FFF"/></svg>

  <!-- 按钮组 -->

</body>
</html>
