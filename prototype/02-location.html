<!DOCTYPE html>
<!-- 鲜啤到 · 定位授权/地址选择页 | 设计系统：Starbucks 定制 | 主色 #F5A623 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>鲜啤到 · 定位授权</title>
<style>
  :root {
    --color-primary: #F5A623;
    --color-primary-hover: #E8951A;
    --color-primary-light: #FFF0D6;
    --color-secondary-dark: #2C1810;
    --color-secondary-cream: #FFF8F0;
    --color-bg: #FFF8F0;
    --color-surface: #FFFFFF;
    --color-surface-alt: #FAF3EB;
    --color-border: #E8DDD0;
    --color-border-light: #F0E8DC;
    --color-text-primary: #2C1810;
    --color-text-secondary: #8B7D6B;
    --color-text-tertiary: #B0A490;
    --color-text-inverse: #FFFFFF;
    --color-success: #4CAF50;
    --color-success-light: #E8F5E9;
    --color-cold-chain: #00BFA5;
    --gradient-primary-btn: linear-gradient(135deg, #F5A623 0%, #E8951A 100%);
    --shadow-card: 0 1px 4px rgba(44, 24, 16, 0.06);
    --shadow-floating: 0 4px 16px rgba(44, 24, 16, 0.12);
    --shadow-primary-glow: 0 2px 8px rgba(245, 166, 35, 0.3);
    --font-heading: "PingFang SC", "HarmonyOS Sans SC", "Source Han Sans CN", sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    --font-number: "DIN Alternate", "DIN", "Roboto Mono", "SF Mono", monospace;
    --radius-card: 12px;
    --radius-pill: 24px;
    --radius-tag: 4px;
    --space-sm: 12px;
    --space-md: 16px;
    --space-lg: 20px;
    --space-xl: 24px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: var(--font-body);
    width: 375px;
    height: 812px;
    margin: 0 auto;
    background: var(--color-bg);
    overflow: hidden;
    position: relative;
  }

  /* 状态栏占位 */
  .status-bar {
    height: 44px;
    background: var(--color-bg);
  }

  /* 导航栏 */
  .nav-bar {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background: var(--color-bg);
  }
  .nav-bar__title {
    font-size: 17px;
    font-weight: 600;
    color: var(--color-text-primary);
  }
  .nav-bar__back {
    position: absolute;
    left: var(--space-md);
    font-size: 24px;
    color: var(--color-text-primary);
    text-decoration: none;
    line-height: 1;
  }

  /* 地图背景区域 */
  .map-area {
    height: 240px;
    background: linear-gradient(180deg, #E8DDD0 0%, #F0E8DC 100%);
    position: relative;
    overflow: hidden;
  }
  /* 模拟地图路网 */
  .map-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(0deg, transparent 48%, rgba(176, 164, 144, 0.15) 49%, rgba(176, 164, 144, 0.15) 51%, transparent 52%),
      linear-gradient(90deg, transparent 48%, rgba(176, 164, 144, 0.15) 49%, rgba(176, 164, 144, 0.15) 51%, transparent 52%);
    background-size: 40px 40px;
  }
  .map-road {
    position: absolute;
    background: rgba(255, 255, 255, 0.6);
  }
  .map-road-1 { width: 100%; height: 3px; top: 80px; }
  .map-road-2 { width: 3px; height: 100%; left: 120px; }
  .map-road-3 { width: 100%; height: 2px; top: 160px; background: rgba(255, 255, 255, 0.4); }
  .map-road-4 { width: 2px; height: 100%; right: 80px; background: rgba(255, 255, 255, 0.4); }

  /* 配送范围圆圈 */
  .delivery-radius {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 180px;
    height: 180px;
    border-radius: 50%;
    border: 2px dashed rgba(245, 166, 35, 0.4);
    background: rgba(245, 166, 35, 0.05);
  }

  /* 中心定位标记 */
  .location-pin {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -100%);
    z-index: 2;
  }
  .location-pin__dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--color-primary);
    border: 3px solid #FFFFFF;
    box-shadow: 0 2px 8px rgba(245, 166, 35, 0.4);
    margin: 0 auto;
  }
  .location-pin__pulse {
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 24px;
    height: 8px;
    background: rgba(245, 166, 35, 0.2);
    border-radius: 50%;
    filter: blur(4px);
  }

  /* 当前定位信息卡 */
  .current-location-card {
    position: absolute;
    bottom: -20px;
    left: var(--space-md);
    right: var(--space-md);
    background: var(--color-surface);
    border-radius: var(--radius-card);
    padding: var(--space-md);
    box-shadow: var(--shadow-floating);
    z-index: 3;
  }
  .current-location-card__label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--color-success);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .current-location-card__address {
    font-size: 15px;
    font-weight: 600;
    color: var(--color-text-primary);
    line-height: 1.4;
    margin-bottom: 4px;
  }
  .current-location-card__detail {
    font-size: 12px;
    color: var(--color-text-secondary);
    line-height: 1.4;
  }

  /* 搜索栏 */
  .search-bar {
    margin: 36px var(--space-md) 0;
    height: 40px;
    background: var(--color-surface);
    border-radius: 20px;
    border: 1px solid var(--color-border);
    display: flex;
    align-items: center;
    padding: 0 var(--space-md);
    gap: 8px;
  }
  .search-bar__icon { color: var(--color-text-tertiary); flex-shrink: 0; }
  .search-bar__input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 14px;
    background: transparent;
    color: var(--color-text-primary);
  }
  .search-bar__input::placeholder { color: var(--color-text-tertiary); }

  /* 常用地址列表 */
  .address-section {
    padding: var(--space-lg) var(--space-md) 0;
  }
  .address-section__title {
    font-size: 14px;
    font-weight: 600;
    color: var(--color-text-primary);
    margin-bottom: var(--space-sm);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .address-item {
    display: flex;
    align-items: flex-start;
    gap: var(--space-sm);
    padding: var(--space-sm) 0;
    border-bottom: 1px solid var(--color-border-light);
  }
  .address-item:last-child { border-bottom: none; }
  .address-item__icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: var(--color-primary-light);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .address-item__content { flex: 1; min-width: 0; }
  .address-item__header {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 2px;
  }
  .address-item__name {
    font-size: 15px;
    font-weight: 600;
    color: var(--color-text-primary);
  }
  .address-item__tag {
    font-size: 10px;
    font-weight: 600;
    color: var(--color-primary);
    background: var(--color-primary-light);
    padding: 1px 6px;
    border-radius: var(--radius-tag);
  }
  .address-item__tag--default {
    background: var(--color-success-light);
    color: var(--color-success);
  }
  .address-item__detail {
    font-size: 12px;
    color: var(--color-text-secondary);
    line-height: 1.4;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .address-item__distance {
    font-size: 12px;
    color: var(--color-text-tertiary);
    font-family: var(--font-number);
    flex-shrink: 0;
    margin-top: 2px;
  }

  /* 底部授权提示 */
  .auth-prompt {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--color-surface);
    border-radius: 16px 16px 0 0;
    padding: var(--space-lg) var(--space-md) calc(var(--space-lg) + env(safe-area-inset-bottom));
    box-shadow: 0 -4px 16px rgba(44, 24, 16, 0.08);
  }
  .auth-prompt__icon {
    width: 56px;
    height: 56px;
    margin: 0 auto var(--space-sm);
    background: var(--color-primary-light);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .auth-prompt__title {
    text-align: center;
    font-size: 17px;
    font-weight: 700;
    color: var(--color-text-primary);
    margin-bottom: 6px;
  }
  .auth-prompt__desc {
    text-align: center;
    font-size: 13px;
    color: var(--color-text-secondary);
    line-height: 1.5;
    margin-bottom: var(--space-lg);
  }
  .auth-prompt__btn {
    width: 100%;
    height: 48px;
    background: var(--gradient-primary-btn);
    color: var(--color-text-inverse);
    font-size: 16px;
    font-weight: 500;
    border: none;
    border-radius: var(--radius-pill);
    box-shadow: var(--shadow-primary-glow);
    cursor: pointer;
  }
  .auth-prompt__btn:active { opacity: 0.85; transform: scale(0.98); }
  .auth-prompt__link {
    text-align: center;
    margin-top: var(--space-sm);
    font-size: 13px;
    color: var(--color-text-secondary);
  }
  .auth-prompt__link span { color: var(--color-primary); font-weight: 500; }

  /* 合规警示 */
  .compliance-warning {
    position: absolute;
    bottom: 0;
    left: 0; right: 0;
    text-align: center;
    font-size: 11px;
    color: var(--color-text-tertiary);
    padding: 8px var(--space-md);
    line-height: 1.6;
  }

/* === 无障碍：动画降级 === */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

</style>
</head>
<body>
  <!-- 状态栏 -->
  <div class="status-bar"></div>

  <!-- 导航栏 -->
  <div class="nav-bar">
    <span class="nav-bar__title">选择配送地址</span>
  </div>

  <!-- 地图区域 -->
  <div class="map-area">
    <div class="map-grid"></div>
    <div class="map-road map-road-1"></div>
    <div class="map-road map-road-2"></div>
    <div class="map-road map-road-3"></div>
    <div class="map-road map-road-4"></div>
    <div class="delivery-radius"></div>
    <div class="location-pin">
      <div class="location-pin__dot"></div>
      <div class="location-pin__pulse"></div>
    </div>

    <!-- 当前定位信息卡 -->
    <div class="current-location-card">
      <div class="current-location-card__label">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5" fill="#4CAF50"/><path d="M5 7L6.5 8.5L9 5.5" stroke="#FFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        已定位 · 配送范围内
      </div>
      <div class="current-location-card__address">朝阳区望京SOHO T1座</div>
      <div class="current-location-card__detail">距您 1.2km · 预计 18 分钟送达</div>
    </div>
  </div>

  <!-- 搜索栏 -->
  <div class="search-bar">
    <svg class="search-bar__icon" width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.5"/><path d="M14 14L18 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <input class="search-bar__input" type="text" placeholder="搜索小区、写字楼、商场">
  </div>

  <!-- 常用地址 -->
  <div class="address-section">
    <div class="address-section__title">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="2" fill="#F5A623"/><circle cx="8" cy="8" r="6" stroke="#F5A623" stroke-width="1" opacity="0.3"/></svg>
      常用地址
    </div>

    <div class="address-item">
      <div class="address-item__icon">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 7L9 2L15 7V14C15 14.55 14.55 15 14 15H4C3.45 15 3 14.55 3 14V7Z" stroke="#F5A623" stroke-width="1.5" stroke-linejoin="round"/><rect x="7" y="10" width="4" height="5" stroke="#F5A623" stroke-width="1.2" stroke-linejoin="round"/></svg>
      </div>
      <div class="address-item__content">
        <div class="address-item__header">
          <span class="address-item__name">张先生</span>
          <span class="address-item__tag address-item__tag--default">默认</span>
          <span class="address-item__tag">家</span>
        </div>
        <div class="address-item__detail">朝阳区望京西园三区 12号楼 3单元 502室</div>
      </div>
      <span class="address-item__distance">1.2km</span>
    </div>

    <div class="address-item">
      <div class="address-item__icon">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="3" y="4" width="12" height="11" rx="1" stroke="#F5A623" stroke-width="1.5" stroke-linejoin="round"/><line x1="3" y1="7" x2="15" y2="7" stroke="#F5A623" stroke-width="1.5"/><line x1="6" y1="2" x2="6" y2="6" stroke="#F5A623" stroke-width="1.5" stroke-linecap="round"/><line x1="12" y1="2" x2="12" y2="6" stroke="#F5A623" stroke-width="1.5" stroke-linecap="round"/></svg>
      </div>
      <div class="address-item__content">
        <div class="address-item__header">
          <span class="address-item__name">张先生</span>
          <span class="address-item__tag">公司</span>
        </div>
        <div class="address-item__detail">海淀区中关村软件园 二期 西二旗大厦 B座 8F</div>
      </div>
      <span class="address-item__distance">3.8km</span>
    </div>

    <div class="address-item">
      <div class="address-item__icon">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 16C9 16 15 11 15 7C15 3.69 12.31 1 9 1C5.69 1 3 3.69 3 7C3 11 9 16 9 16Z" stroke="#F5A623" stroke-width="1.5" stroke-linejoin="round"/><circle cx="9" cy="7" r="2.5" stroke="#F5A623" stroke-width="1.5"/></svg>
      </div>
      <div class="address-item__content">
        <div class="address-item__header">
          <span class="address-item__name">张先生</span>
          <span class="address-item__tag">其他</span>
        </div>
        <div class="address-item__detail">朝阳区三里屯SOHO 5号楼 1层 临街商铺</div>
      </div>
      <span class="address-item__distance">2.5km</span>
    </div>
  </div>

  <!-- 底部授权提示 -->
  <div class="auth-prompt">
    <div class="auth-prompt__icon">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><path d="M14 2C9.03 2 5 6.03 5 11C5 17.5 14 26 14 26C14 26 23 17.5 23 11C23 6.03 18.97 2 14 2Z" fill="#F5A623"/><circle cx="14" cy="11" r="3" fill="#FFF8F0"/></svg>
    </div>
    <div class="auth-prompt__title">开启定位服务</div>
    <div class="auth-prompt__desc">鲜啤到需要获取您的位置信息，<br>以便为您提供更精准的配送服务</div>
    <button class="auth-prompt__btn">允许定位授权</button>
    <div class="auth-prompt__link">手动选择地址 <span>></span></div>
  </div>

  <!-- 合规警示 -->
  <div class="compliance-warning">未成年人禁止购买酒精饮品 · 适量饮酒，禁止酒驾</div>
</body>
</html>
