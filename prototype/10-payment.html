<!DOCTYPE html>
<!-- 鲜啤到 · 支付收银台 | 设计系统：Starbucks 定制 | 主色 #F5A623 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>鲜啤到 · 支付</title>
<style>
  :root {
    --color-primary: #F5A623;
    --color-primary-light: #FFF0D6;
    --color-secondary-dark: #2C1810;
    --color-bg: #FFF8F0;
    --color-surface: #FFFFFF;
    --color-surface-alt: #FAF3EB;
    --color-border: #E8DDD0;
    --color-border-light: #F0E8DC;
    --color-text-primary: #2C1810;
    --color-text-secondary: #8B7D6B;
    --color-text-tertiary: #B0A490;
    --color-text-inverse: #FFFFFF;
    --color-success: #4CAF50;
    --color-danger: #F44336;
    --color-warning: #FF9800;
    --color-storage-exclusive: #F5A623;
    --color-storage-exclusive-bg: #FFF0D6;
    --gradient-primary-btn: linear-gradient(135deg, #F5A623 0%, #E8951A 100%);
    --gradient-storage-card: linear-gradient(135deg, #F5A623 0%, #D4A843 100%);
    --shadow-card: 0 1px 4px rgba(44, 24, 16, 0.06);
    --shadow-floating: 0 4px 16px rgba(44, 24, 16, 0.12);
    --shadow-primary-glow: 0 2px 8px rgba(245, 166, 35, 0.3);
    --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    --font-number: "DIN Alternate", "DIN", "Roboto Mono", "SF Mono", monospace;
    --radius-tag: 4px;
    --radius-card: 12px;
    --radius-pill: 24px;
    --radius-circle: 999px;
    --space-xs: 8px;
    --space-sm: 12px;
    --space-md: 16px;
    --space-lg: 20px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: var(--font-body);
    width: 375px;
    height: 812px;
    margin: 0 auto;
    background: var(--color-bg);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* 导航栏 */
  .nav-bar {
    height: 44px;
    background: var(--color-surface);
    display: flex; align-items: center;
    padding: 0 var(--space-md);
    position: relative;
    border-bottom: 1px solid var(--color-border-light);
  }
  .nav-bar__back { font-size: 22px; color: var(--color-text-primary); line-height: 1; text-decoration: none; }
  .nav-bar__title {
    position: absolute; left: 50%; transform: translateX(-50%);
    font-size: 17px; font-weight: 600; color: var(--color-text-primary);
  }

  /* 倒计时 */
  .countdown-bar {
    background: var(--color-surface);
    padding: var(--space-sm) var(--space-md);
    text-align: center;
    font-size: 13px;
    color: var(--color-text-secondary);
  }
  .countdown-bar__time {
    font-family: var(--font-number);
    font-size: 16px;
    font-weight: 700;
    color: var(--color-danger);
  }

  /* 支付金额 */
  .amount-section {
    background: var(--color-surface);
    padding: var(--space-lg) var(--space-md);
    text-align: center;
    margin-bottom: var(--space-sm);
  }
  .amount-section__label {
    font-size: 13px; color: var(--color-text-secondary); margin-bottom: 8px;
  }
  .amount-section__value {
    font-family: var(--font-number);
    font-size: 40px; font-weight: 700;
    color: var(--color-text-primary);
    line-height: 1;
  }
  .amount-section__value::before { content: '¥'; font-size: 24px; vertical-align: top; }
  .amount-section__discount {
    font-size: 12px; color: var(--color-success); margin-top: 8px;
  }

  /* 储值卡 */
  .storage-card {
    background: var(--gradient-storage-card);
    border-radius: var(--radius-card);
    padding: var(--space-md);
    margin: 0 var(--space-md) var(--space-sm);
    color: #FFF;
    position: relative;
    overflow: hidden;
  }
  .storage-card::after {
    content: '';
    position: absolute;
    top: -20px; right: -20px;
    width: 100px; height: 100px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.1);
  }
  .storage-card__header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
  }
  .storage-card__title {
    font-size: 14px; font-weight: 600;
    display: flex; align-items: center; gap: 6px;
  }
  .storage-card__badge {
    background: rgba(255,255,255,0.25);
    padding: 2px 8px; border-radius: var(--radius-tag);
    font-size: 10px; font-weight: 600;
  }
  .storage-card__balance {
    font-family: var(--font-number);
    font-size: 24px; font-weight: 700;
  }
  .storage-card__balance::before { content: '¥'; font-size: 14px; }
  .storage-card__hint {
    font-size: 11px; opacity: 0.8; margin-top: 4px;
  }

  /* 支付方式列表 */
  .pay-list {
    background: var(--color-surface);
    border-radius: var(--radius-card);
    margin: 0 var(--space-md) var(--space-sm);
    box-shadow: var(--shadow-card);
    overflow: hidden;
  }
  .pay-item {
    display: flex; align-items: center; gap: var(--space-sm);
    padding: var(--space-md);
    border-bottom: 1px solid var(--color-border-light);
    cursor: pointer;
  }
  .pay-item:last-child { border-bottom: none; }
  .pay-item__icon {
    width: 40px; height: 40px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .pay-item__icon--storage { background: var(--color-primary-light); }
  .pay-item__icon--wechat { background: #07C160; }
  .pay-item__info { flex: 1; }
  .pay-item__name { font-size: 14px; font-weight: 600; color: var(--color-text-primary); }
  .pay-item__desc { font-size: 11px; color: var(--color-text-secondary); margin-top: 2px; }
  .pay-item__radio {
    width: 22px; height: 22px; border-radius: 50%;
    border: 1.5px solid var(--color-border);
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  }
  .pay-item__radio--checked {
    background: var(--color-primary); border-color: var(--color-primary);
  }
  .pay-item__tag {
    font-size: 10px; padding: 2px 6px; border-radius: var(--radius-tag);
    background: var(--color-storage-exclusive-bg); color: var(--color-storage-exclusive);
    font-weight: 600;
  }

  /* 优惠券 */
  .coupon-section {
    background: var(--color-surface);
    border-radius: var(--radius-card);
    margin: 0 var(--space-md) var(--space-sm);
    box-shadow: var(--shadow-card);
    padding: var(--space-md);
    display: flex; align-items: center; justify-content: space-between;
  }
  .coupon-section__label { font-size: 14px; color: var(--color-text-primary); }
  .coupon-section__value { font-size: 14px; color: var(--color-danger); font-weight: 600; font-family: var(--font-number); }

  /* 合规警示 */
  .compliance-warning {
    text-align: center; font-size: 11px; color: var(--color-text-tertiary);
    padding: var(--space-sm) var(--space-md); line-height: 1.6;
  }

  /* 底部支付按钮 */
  .pay-button {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: var(--space-md);
    padding-bottom: calc(var(--space-md) + env(safe-area-inset-bottom));
    background: var(--color-surface);
    border-top: 1px solid var(--color-border-light);
    box-shadow: 0 -2px 8px rgba(44, 24, 16, 0.06);
  }
  .pay-button__btn {
    width: 100%;
    height: 50px;
    background: var(--gradient-primary-btn);
    color: #FFF;
    border: none;
    border-radius: var(--radius-pill);
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: var(--shadow-primary-glow);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .pay-button__btn:active { opacity: 0.85; transform: scale(0.98); }

  /* 支付密码输入（模拟） */
  .password-prompt {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: var(--color-surface);
    border-radius: 16px 16px 0 0;
    padding: var(--space-lg) var(--space-md);
    padding-bottom: calc(var(--space-lg) + env(safe-area-inset-bottom));
    box-shadow: var(--shadow-floating);
    z-index: 500;
    animation: slideUp 0.3s ease-out;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .password-prompt__overlay {
    position: absolute;
    inset: 0;
    background: rgba(44, 24, 16, 0.5);
    z-index: 499;
  }
  .password-prompt__title {
    text-align: center;
    font-size: 16px; font-weight: 600;
    color: var(--color-text-primary);
    margin-bottom: var(--space-lg);
  }
  .password-prompt__amount {
    text-align: center;
    font-family: var(--font-number);
    font-size: 32px; font-weight: 700;
    color: var(--color-text-primary);
    margin-bottom: var(--space-lg);
  }
  .password-prompt__amount::before { content: '¥'; font-size: 18px; }
  .password-dots {
    display: flex; justify-content: center; gap: 12px;
    margin-bottom: var(--space-lg);
  }
  .password-dot {
    width: 40px; height: 40px;
    border-bottom: 2px solid var(--color-border);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; color: var(--color-text-primary);
  }
  .password-dot--filled::after {
    content: '●';
  }
  .password-prompt__method {
    text-align: center;
    font-size: 13px; color: var(--color-text-secondary);
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }

/* === 无障碍：动画降级 === */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

</style>
</head>
<body>
  <!-- 导航栏 -->
  <div class="nav-bar">
    <span class="nav-bar__back">‹</span>
    <span class="nav-bar__title">收银台</span>
  </div>

  <!-- 倒计时 -->
  <div class="countdown-bar">
    支付剩余时间 <span class="countdown-bar__time">14:58</span>
  </div>

  <!-- 支付金额 -->
  <div class="amount-section">
    <div class="amount-section__label">需支付金额</div>
    <div class="amount-section__value">142.40</div>
    <div class="amount-section__discount">储值专享已优惠 ¥5.60 · 优惠券抵扣 ¥15.00</div>
  </div>

  <!-- 储值卡 -->
  <div class="storage-card">
    <div class="storage-card__header">
      <div class="storage-card__title">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2" y="5" width="14" height="8" rx="1.5" stroke="#FFF" stroke-width="1.5"/><circle cx="9" cy="9" r="2" fill="#FFF"/></svg>
        鲜啤到储值卡
      </div>
      <span class="storage-card__badge">储值专享</span>
    </div>
    <div class="storage-card__balance">500.00</div>
    <div class="storage-card__hint">余额充足 · 储值卡支付自动享专享价</div>
  </div>

  <!-- 支付方式 -->
  <div class="pay-list">
    <div class="pay-item">
      <div class="pay-item__icon pay-item__icon--storage">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><rect x="3" y="6" width="16" height="10" rx="2" stroke="#F5A623" stroke-width="1.5"/><circle cx="11" cy="11" r="2.5" fill="#F5A623"/></svg>
      </div>
      <div class="pay-item__info">
        <div class="pay-item__name">储值卡支付 <span class="pay-item__tag">推荐</span></div>
        <div class="pay-item__desc">余额 ¥500.00 · 享储值专享价</div>
      </div>
      <div class="pay-item__radio pay-item__radio--checked">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M4 7L6 9L10 5" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>
    <div class="pay-item">
      <div class="pay-item__icon pay-item__icon--wechat">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M8 4C4.69 4 2 6.24 2 9C2 10.6 2.9 12.02 4.3 13L3.5 15L6 13.8C6.6 14 7.3 14.1 8 14.1" fill="#FFF"/><path d="M14 7C11.24 7 9 9.01 9 11.5C9 13.99 11.24 16 14 16C14.7 16 15.3 15.9 15.9 15.7L18 16.8L17.3 14.8C18.3 13.9 19 12.8 19 11.5C19 9.01 16.76 7 14 7Z" fill="#FFF"/></svg>
      </div>
      <div class="pay-item__info">
        <div class="pay-item__name">微信支付</div>
        <div class="pay-item__desc">零钱或银行卡支付</div>
      </div>
      <div class="pay-item__radio"></div>
    </div>
  </div>

  <!-- 优惠券核销 -->
  <div class="coupon-section">
    <span class="coupon-section__label">已使用优惠券</span>
    <span class="coupon-section__value">-¥15.00</span>
  </div>

  <!-- 合规警示 -->
  <div class="compliance-warning">未成年人禁止购买酒精饮品 · 适量饮酒，禁止酒驾</div>

  <!-- 底部支付按钮 -->
  <div class="pay-button">
    <button class="pay-button__btn">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="3" y="5" width="14" height="10" rx="2" stroke="#FFF" stroke-width="1.5"/><circle cx="10" cy="10" r="2" fill="#FFF"/></svg>
      确认支付 ¥142.40
    </button>
  </div>

  <!-- 支付密码弹层（模拟） -->
  <div class="password-prompt__overlay"></div>
  <div class="password-prompt">
    <div class="password-prompt__title">储值卡支付</div>
    <div class="password-prompt__amount">142.40</div>
    <div class="password-dots">
      <div class="password-dot password-dot--filled"></div>
      <div class="password-dot password-dot--filled"></div>
      <div class="password-dot password-dot--filled"></div>
      <div class="password-dot"></div>
      <div class="password-dot"></div>
      <div class="password-dot"></div>
    </div>
    <div class="password-prompt__method">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="2" y="4" width="10" height="6" rx="1" stroke="#8B7D6B" stroke-width="1.2"/><circle cx="7" cy="7" r="1.5" fill="#8B7D6B"/></svg>
      储值卡支付 · 余额 ¥500.00
    </div>
  </div>
</body>
</html>
