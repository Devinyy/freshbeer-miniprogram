<!DOCTYPE html>
<!-- 鲜啤到 · 用户中心页 | 设计系统：Starbucks 定制 | 主色 #F5A623 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>鲜啤到 · 我的</title>
<style>
  :root {
    --color-primary: #F5A623;
    --color-primary-light: #FFF0D6;
    --color-secondary-dark: #2C1810;
    --color-bg: #FFF8F0;
    --color-surface: #FFFFFF;
    --color-surface-alt: #FAF3EB;
    --color-border: #E8DDD0;
    --color-border-light: #F0E8DC;
    --color-text-primary: #2C1810;
    --color-text-secondary: #8B7D6B;
    --color-text-tertiary: #B0A490;
    --color-text-inverse: #FFFFFF;
    --color-success: #4CAF50;
    --color-danger: #F44336;
    --color-warning: #FF9800;
    --color-member-gold: #D4A843;
    --gradient-storage-card: linear-gradient(135deg, #F5A623 0%, #D4A843 100%);
    --gradient-night-bg: linear-gradient(180deg, #2C1810 0%, #1A0F08 100%);
    --shadow-card: 0 1px 4px rgba(44, 24, 16, 0.06);
    --shadow-primary-glow: 0 2px 8px rgba(245, 166, 35, 0.3);
    --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    --font-number: "DIN Alternate", "DIN", "Roboto Mono", "SF Mono", monospace;
    --radius-tag: 4px;
    --radius-image: 8px;
    --radius-card: 12px;
    --radius-pill: 24px;
    --space-xs: 8px;
    --space-sm: 12px;
    --space-md: 16px;
    --space-lg: 20px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: var(--font-body);
    width: 375px;
    height: 812px;
    margin: 0 auto;
    background: var(--color-bg);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* 滚动区 */
  .scroll-area {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 70px;
  }

  /* 用户信息头部（深色背景） */
  .user-header {
    background: var(--gradient-night-bg);
    padding: 20px var(--space-md) var(--space-lg);
    position: relative;
    overflow: hidden;
  }
  .user-header::before {
    content: '';
    position: absolute;
    top: -30px; right: -30px;
    width: 120px; height: 120px;
    border-radius: 50%;
    background: rgba(245, 166, 35, 0.1);
  }
  .user-info-row {
    display: flex; align-items: center; gap: var(--space-md);
    position: relative; z-index: 1;
  }
  .user-avatar {
    width: 60px; height: 60px;
    border-radius: 50%;
    background: var(--color-primary);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 700; color: #FFF;
    flex-shrink: 0;
    border: 3px solid rgba(255,255,255,0.2);
  }
  .user-detail { flex: 1; }
  .user-name {
    font-size: 18px; font-weight: 700; color: #FFF8F0;
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 4px;
  }
  .user-level {
    font-size: 10px; padding: 1px 8px; border-radius: var(--radius-tag);
    background: var(--color-member-gold); color: #FFF; font-weight: 600;
  }
  .user-tag {
    font-size: 11px; color: rgba(255,248,240,0.6);
    display: flex; align-items: center; gap: 4px;
  }
  .user-tag--verified { color: var(--color-success); }

  /* 储值卡 */
  .storage-card-mini {
    background: var(--gradient-storage-card);
    border-radius: var(--radius-card);
    padding: var(--space-md);
    margin-top: var(--space-md);
    position: relative;
    z-index: 1;
    display: flex; align-items: center; justify-content: space-between;
    overflow: hidden;
  }
  .storage-card-mini::after {
    content: '';
    position: absolute;
    top: -20px; right: -20px;
    width: 80px; height: 80px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
  }
  .storage-card-mini__left {}
  .storage-card-mini__label {
    font-size: 11px; color: rgba(255,255,255,0.8);
    display: flex; align-items: center; gap: 4px;
    margin-bottom: 4px;
  }
  .storage-card-mini__balance {
    font-family: var(--font-number);
    font-size: 28px; font-weight: 700; color: #FFF;
  }
  .storage-card-mini__balance::before { content: '¥'; font-size: 16px; }
  .storage-card-mini__btn {
    background: rgba(255,255,255,0.25);
    color: #FFF;
    font-size: 13px; font-weight: 600;
    padding: 8px 20px; border-radius: 20px;
    border: none; cursor: pointer;
    position: relative; z-index: 1;
  }

  /* 订单快捷入口 */
  .order-shortcuts {
    background: var(--color-surface);
    border-radius: var(--radius-card);
    margin: var(--space-sm) var(--space-md);
    padding: var(--space-md);
    box-shadow: var(--shadow-card);
  }
  .order-shortcuts__header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: var(--space-md);
  }
  .order-shortcuts__title { font-size: 15px; font-weight: 700; color: var(--color-text-primary); }
  .order-shortcuts__link { font-size: 12px; color: var(--color-text-secondary); }

  .order-shortcuts__grid {
    display: flex; justify-content: space-around;
  }
  .shortcut-item {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    position: relative; cursor: pointer;
  }
  .shortcut-item__icon {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--color-primary-light);
    display: flex; align-items: center; justify-content: center;
  }
  .shortcut-item__label { font-size: 11px; color: var(--color-text-primary); }
  .shortcut-item__badge {
    position: absolute; top: -2px; right: 8px;
    min-width: 16px; height: 16px; border-radius: 50%;
    background: var(--color-danger); color: #FFF;
    font-size: 10px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    padding: 0 4px;
  }

  /* 功能列表 */
  .menu-section {
    background: var(--color-surface);
    border-radius: var(--radius-card);
    margin: 0 var(--space-md) var(--space-sm);
    box-shadow: var(--shadow-card);
    overflow: hidden;
  }
  .menu-item {
    display: flex; align-items: center; gap: var(--space-sm);
    padding: var(--space-sm) var(--space-md);
    border-bottom: 1px solid var(--color-border-light);
    cursor: pointer;
  }
  .menu-item:last-child { border-bottom: none; }
  .menu-item__icon {
    width: 32px; height: 32px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .menu-item__label { flex: 1; font-size: 14px; color: var(--color-text-primary); }
  .menu-item__value { font-size: 12px; color: var(--color-text-secondary); }
  .menu-item__arrow { color: var(--color-text-tertiary); font-size: 14px; }
  .menu-item__tag {
    font-size: 10px; padding: 1px 6px; border-radius: var(--radius-tag);
    font-weight: 600;
  }
  .menu-item__tag--verified { background: #E8F5E9; color: var(--color-success); }
  .menu-item__tag--unverified { background: #FFF3E0; color: var(--color-warning); }

  /* 合规警示 */
  .compliance-warning {
    text-align: center; font-size: 11px; color: var(--color-text-tertiary);
    padding: var(--space-md); line-height: 1.6;
  }

  /* 底部 Tab */
  .tabbar {
    height: 56px;
    background: var(--color-surface);
    border-top: 1px solid var(--color-border-light);
    display: flex;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tabbar__item {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px;
    color: var(--color-text-secondary); position: relative;
  }
  .tabbar__item--active { color: var(--color-primary); }
  .tabbar__item--cart .tabbar__icon-wrap {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--color-primary-light);
    display: flex; align-items: center; justify-content: center;
    margin-top: -8px; border: 3px solid var(--color-surface);
  }
  .tabbar__badge {
    position: absolute; top: 0; right: 50%; transform: translateX(16px);
    min-width: 16px; height: 16px; border-radius: 50%;
    background: var(--color-danger); color: #FFF;
    font-size: 10px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    padding: 0 4px;
  }
  .tabbar__label { font-size: 10px; font-weight: 500; }

/* === 无障碍：动画降级 === */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

</style>
</head>
